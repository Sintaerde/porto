name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base otomatis dari nama repo: /nama-repo/ (atau / bila repo bernama <user>.github.io).
      # Pakai custom domain? Ubah baris ini menjadi: echo "VITE_BASE=/" >> "$GITHUB_ENV"
      - name: Tentukan base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "VITE_BASE=/" >> "$GITHUB_ENV" ;;
            *) echo "VITE_BASE=/${REPO}/" >> "$GITHUB_ENV" ;;
          esac

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
